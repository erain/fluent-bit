  parsers.conf: "[PARSER]\n    Name              containerd\n    Format            regex\n
    \   # The timestamp is described in https://www.rfc-editor.org/rfc/rfc3339#section-5.6\n
    \   # Containerd logs follow the pattern of CRI Log Format (https://github.com/kubernetes/design-proposals-archive/blob/main/node/kubelet-cri-logging.md):
    <timestamp> <stream> <tag> <log_content>\n    # F in tag means \"Full Log\", and
    P means \"Partial Log\".\n    \n    Regex             ^(?<time>[0-9]{4}-[0-9]{2}-[0-9]{2}[Tt
    ][0-9]{2}:[0-9]{2}:[0-9]{2}(?:\\.[0-9]+)?(?:[Zz]|[+-][0-9]{2}:[0-9]{2}))\\s+(?<stream>stdout|stderr)\\s(F|P)\\s(?<message>.*)$\n
    \   \n    Time_Key          time\n    Reserve_Data      On\n    Time_Format       %Y-%m-%dT%H:%M:%S.%L%z\n
    \   Skip_Empty_Values false\n\n[PARSER]\n    Name        json\n    Format      json\n\n[PARSER]\n
    \   Name        syslog\n    Format      regex\n    Regex       ^\\<(?<pri>[0-9]+)\\>(?<time>[^
    ]* {1,2}[^ ]* [^ ]*) (?<host>[^ ]*) (?<ident>[a-zA-Z0-9_\\/\\.\\-]*)(?:\\[(?<pid>[0-9]+)\\])?(?:[^\\:]*\\:)?
    *(?<message>.*)$\n    Time_Key    time\n    Time_Format %b %d %H:%M:%S\n\n[PARSER]\n
    \   Name        glog\n    Format      regex\n    # We skip the glog timestamp
    as it doesn't have year (in most cases) and time zone information.\n    # Instead,
    we rely on the containerd timestamp, which is available for every log line.\n
    \   Regex       ^(?<severity>\\w)\\d{4}?\\d{4} [^\\s]*\\s+(?<pid>\\d+)\\s+(?<source_file>[^
    \\]]+)\\:(?<source_line>\\d+)\\]\\s(?<message>.*)$\n\n[PARSER]\n    Name        tsl_tf_cpp\n
    \   Format      regex\n    # TensorFlow/TSL customizes the Abseil C++ log format
    to include the full YYYY-MM-DD date and omits the thread ID.\n    Regex       ^\\d{4}-\\d{2}-\\d{2}
    \\d{2}:\\d{2}:\\d{2}\\.\\d{6}:\\s+(?<severity>[IWEF])\\s+(?<source_file>[^\\s:]+):(?<source_line>\\d+)\\]\\s+(?<message>.*)$\n\n[PARSER]\n
    \   Name        network-log\n    Format      json\n    Time_Key    timestamp\n
    \   Time_Format %Y-%m-%dT%H:%M:%S.%L%z\n\n# Example:\n# [2023/01/05 00:01:58]
    [ info] [output:http:http.0] 127.0.0.1:2021, HTTP status=200\\\n# Rubular: https://screenshot.googleplex.com/8SvHiZJLUkW9idQ\n[PARSER]\n
    \   Name   fluentbit\n    Format regex\n    \n    Regex  \\[(?<time>[^\\]]+)\\][
    ]*\\[[ ]*(?<severity>[^\\]]+)\\][ ]*\\[(?<plugin>[^\\]]+)\\] (?<message>.*)\n
    \   \n    Time_Key time\n    Time_Format %Y/%m/%d %H:%M:%S\n\n\n[PARSER]\n    Name
    \   k8s-filter-tag-parser\n    Format  regex\n    Regex   ^(?<namespace_name>[^_.]+)_(?<pod_name>[a-z0-9](?:[-a-z0-9]*[a-z0-9])?(?:\\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*)_(?<container_name>[^.]+)$\n[PARSER]\n
    \   Name    k8s-filter-tag-parser-gvisor\n    Format  regex\n    Regex   ^(?<namespace_name>[^_.]+)_(?<pod_name>[a-z0-9](?:[-a-z0-9]*[a-z0-9])?(?:\\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*)_(?<container_name>[^.]+)$\n\n\n\n[MULTILINE_PARSER]\n
    \   # Fluentd rules reference: https://github.com/GoogleCloudPlatform/fluent-plugin-detect-exceptions/blob/master/lib/fluent/plugin/exception_detector.rb#L87\n
    \   Name          php\n    Type          regex\n    Key_Content   message\n    Flush_Timeout
    1000\n    Rule          \"start_state\" \"/(?:PHP\\ (?:Notice|Parse\\ error|Fatal\\
    error|Warning):)|(?:exception\\ '[^']+'\\ with\\ message\\ ')/x\" \"php_stack_begin\"\n
    \   Rule          \"php_stack_begin\"  \"/^Stack trace:/\"  \"php_stack_frames\"\n
    \   Rule          \"php_stack_frames\" \"/^#\\d/\"           \"php_stack_frames\"\n
    \   Rule          \"php_stack_frames\" \"/^\\s+thrown in /\" \"start_state\"\n[MULTILINE_PARSER]\n
    \   # Fluentbit has built in ruby parser: https://github.com/fluent/fluent-bit/blob/master/src/multiline/flb_ml_parser_ruby.c,
    but it's not compatible with fluentd rules.\n    # Fluentd rules reference: https://github.com/GoogleCloudPlatform/fluent-plugin-detect-exceptions/blob/master/lib/fluent/plugin/exception_detector.rb#L109\n
    \   Name          custom_ruby\n    Type          regex\n    Key_Content   message\n
    \   Flush_Timeout 1000\n    Rule          \"start_state\"             \"/Error
    \\(.*\\):$/\"          \"ruby_before_rails_trace\"\n    Rule          \"ruby_before_rails_trace\"
    \"/^  $/\"                    \"ruby\"\n    Rule          \"ruby_before_rails_trace\"
    \"/^[\\t ]+.*?\\.rb:\\d+:in `/\" \"ruby\"\n    Rule          \"ruby\"                    \"/^[\\t
    ]+.*?\\.rb:\\d+:in `/\" \"ruby\"\n[MULTILINE_PARSER]\n    # Fluentd rules reference:
    https://github.com/GoogleCloudPlatform/fluent-plugin-detect-exceptions/blob/master/lib/fluent/plugin/exception_detector.rb#L116\n
    \   Name          dart\n    Type          regex\n    Key_Content   message\n    Flush_Timeout
    1000\n    Rule          \"start_state\"           \"/^Unhandled exception:$/\"
    \               \"dart_exc\"\n    Rule          \"dart_exc\"              \"/^Instance
    of/\"                          \"dart_stack\"\n    Rule          \"dart_exc\"
    \             \"/^Exception/\"                            \"dart_stack\"\n    Rule
    \         \"dart_exc\"              \"/^Bad state/\"                            \"dart_stack\"\n
    \   Rule          \"dart_exc\"              \"/^IntegerDivisionByZeroException/\"
    \      \"dart_stack\"\n    Rule          \"dart_exc\"              \"/^Invalid
    argument/\"                     \"dart_stack\"\n    Rule          \"dart_exc\"
    \             \"/^RangeError/\"                           \"dart_stack\"\n    Rule
    \         \"dart_exc\"              \"/^Assertion failed/\"                     \"dart_stack\"\n
    \   Rule          \"dart_exc\"              \"/^Cannot instantiate/\"                   \"dart_stack\"\n
    \   Rule          \"dart_exc\"              \"/^Reading static variable/\"              \"dart_stack\"\n
    \   Rule          \"dart_exc\"              \"/^UnimplementedError/\"                   \"dart_stack\"\n
    \   Rule          \"dart_exc\"              \"/^Unsupported operation/\"                \"dart_stack\"\n
    \   Rule          \"dart_exc\"              \"/^Concurrent modification/\"              \"dart_stack\"\n
    \   Rule          \"dart_exc\"              \"/^Out of Memory/\"                        \"dart_stack\"\n
    \   Rule          \"dart_exc\"              \"/^Stack Overflow/\"                       \"dart_stack\"\n
    \   Rule          \"dart_exc\"              \"/^'.+?':.+?$/\"                           \"dart_type_err_line1\"\n
    \   Rule          \"dart_type_err_line1\"   \"/^#\\d+\\s+.+?\\(.+?\\)$/\"         \"dart_stack\"\n
    \   Rule          \"dart_type_err_line1\"   \"/^.+?$/\"                       \"dart_type_err_line2\"\n
    \   Rule          \"dart_type_err_line2\"   \"/^.*?\\^.*?$/\"                  \"dart_type_err_line3\"\n
    \   Rule          \"dart_type_err_line3\"   \"/^$/\"                          \"dart_type_err_line4\"\n
    \   Rule          \"dart_type_err_line4\"   \"/^$/\"                          \"dart_stack\"\n
    \   Rule          \"dart_exc\"              \"/^FormatException/\"            \"dart_format_err_line1\"\n
    \   Rule          \"dart_format_err_line1\" \"/^#\\d+\\s+.+?\\(.+?\\)$/\"         \"dart_stack\"\n
    \   Rule          \"dart_format_err_line1\" \"/^./\"                          \"dart_format_err_line2\"\n
    \   Rule          \"dart_format_err_line2\" \"/^.*?\\^/\"                      \"dart_format_err_line3\"\n
    \   Rule          \"dart_format_err_line3\" \"/^$/\"                          \"dart_stack\"\n
    \   Rule          \"dart_exc\"              \"/^NoSuchMethodError:/\"         \"dart_method_err_line1\"\n
    \   Rule          \"dart_method_err_line1\" \"/^Receiver:/\"                  \"dart_method_err_line2\"\n
    \   Rule          \"dart_method_err_line2\" \"/^Tried calling:/\"             \"dart_method_err_line3\"\n
    \   Rule          \"dart_method_err_line3\" \"/^Found:/\"                     \"dart_stack\"\n
    \   Rule          \"dart_method_err_line3\" \"/^#\\d+\\s+.+?\\(.+?\\)$/\"         \"dart_stack\"\n
    \   Rule          \"dart_stack\"            \"/^#\\d+\\s+.+?\\(.+?\\)$/\"         \"dart_stack\"\n
    \   Rule          \"dart_stack\"            \"/^<asynchronous suspension>$/\"
    \"dart_stack\""
  redact_kubelet.lua: |-
    function redact_sensitive_info(tag, timestamp, record)
      message = record["MESSAGE"]
      if message then
        if string.find(message, "access_token=ya29.[a-zA-Z0-9._-]*") then
          local redact_message = string.gsub(message, "access_token=ya29.[a-zA-Z0-9._-]*", "access_token=<REDACTED>")
          record["MESSAGE"] = redact_message
          return 2, timestamp, record
        end
      end
      return 0, timestamp, record
    end
