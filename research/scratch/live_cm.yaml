: tail\n  - Alias: startupscript\n    DB: /var/lib/google-fluentbit/pos-files/startupscript.db\n    Parser: syslog\n    Path: /var/log/startupscript.log\n    Tag: startupscript\n    name: tail\n  - Alias: policy-action\n    DB: /var/lib/google-fluentbit/pos-files/policy-action.db\n    Parser: network-log\n    Path: /var/log/network/policy_action.log\n    Read_from_Head: true\n    Refresh_Interval: 5\n    Skip_Long_Lines: true\n    Tag: policy-action\n    name: tail\n  - Alias: kube-proxy\n    Buffer_Max_Size: 1MB\n    DB: /var/lib/google-fluentbit/pos-files/kube-proxy.db\n    Mem_Buf_Limit: 1MB\n    Parser: glog\n    Path: /var/log/kube-proxy.log\n    Read_from_Head: true\n    Tag: kube-proxy\n    name: tail\n  - Alias: docker\n    DB: /var/lib/google-fluentbit/pos-files/docker.db\n    Mem_Buf_Limit: 1MB\n    Path: /var/log/journal\n    Systemd_Filter: _SYSTEMD_UNIT=docker.service\n    Tag: docker\n    name: systemd\n  - Alias: kubelet\n    DB: /var/lib/google-fluentbit/pos-files/kubelet.db\n    Mem_Buf_Limit: 1MB\n    Path: /var/log/journal\n    Systemd_Filter: _SYSTEMD_UNIT=kubelet.service\n    Tag: kubelet\n    name: systemd\n  - Alias: kube-node-installation\n    DB: /var/lib/google-fluentbit/pos-files/kube-node-installation.db\n    Mem_Buf_Limit: 1MB\n    Path: /var/log/journal\n    Systemd_Filter: _SYSTEMD_UNIT=kube-node-installation.service\n    Tag: kube-node-installation\n    name: systemd\n  - Alias: kube-node-configuration\n    DB: /var/lib/google-fluentbit/pos-files/kube-node-configuration.db\n    Mem_Buf_Limit: 1MB\n    Path: /var/log/journal\n    Systemd_Filter: _SYSTEMD_UNIT=kube-node-configuration.service\n    Tag: kube-node-configuration\n    name: systemd\n  - Alias: kube-logrotate\n    DB: /var/lib/google-fluentbit/pos-files/kube-logrotate.db\n    Mem_Buf_Limit: 1MB\n    Path: /var/log/journal\n    Systemd_Filter: _SYSTEMD_UNIT=kube-logrotate.service\n    Tag: kube-logrotate\n    name: systemd\n  - Alias: node-problem-detector\n    DB: /var/lib/google-fluentbit/pos-files/node-problem-detector.db\n    Mem_Buf_Limit: 1MB\n    Path: /var/log/journal\n    Systemd_Filter: _SYSTEMD_UNIT=node-problem-detector.service\n    Tag: node-problem-detector\n    name: systemd\n  - Alias: kube-container-runtime-monitor\n    DB: /var/lib/google-fluentbit/pos-files/kube-container-runtime-monitor.db\n    Mem_Buf_Limit: 1MB\n    Path: /var/log/journal\n    Systemd_Filter: _SYSTEMD_UNIT=kube-container-runtime-monitor.service\n    Tag: kube-container-runtime-monitor\n    name: systemd\n  - Alias: kubelet-monitor\n    DB: /var/lib/google-fluentbit/pos-files/kubelet-monitor.db\n    Mem_Buf_Limit: 1MB\n    Path: /var/log/journal\n    Systemd_Filter: _SYSTEMD_UNIT=kubelet-monitor.service\n    Tag: kubelet-monitor\n    name: systemd\n  - Alias: gcfsd\n    DB: /var/lib/google-fluentbit/pos-files/gcfsd.db\n    Mem_Buf_Limit: 1MB\n    Path: /var/log/journal\n    Systemd_Filter: _SYSTEMD_UNIT=gcfsd.service\n    Tag: gcfsd\n    name: systemd\n  - Alias: gcfs-snapshotter\n    DB: /var/lib/google-fluentbit/pos-files/gcfs-snapshotter.db\n    Mem_Buf_Limit: 1MB\n    Path: /var/log/journal\n    Systemd_Filter: _SYSTEMD_UNIT=gcfs-snapshotter.service\n    Tag: gcfs-snapshotter\n    name: systemd\n  - Alias: criproxy\n    DB: /var/lib/google-fluentbit/pos-files/criproxy.db\n    Mem_Buf_Limit: 1MB\n    Path: /var/log/journal\n    Systemd_Filter: _SYSTEMD_UNIT=criproxy.service\n    Tag: criproxy\n    name: systemd\n  - Alias: container-runtime\n    DB: /var/lib/google-fluentbit/pos-files/container-runtime.db\n    Mem_Buf_Limit: 1MB\n    Path: /var/log/journal\n    Systemd_Filter: _SYSTEMD_UNIT=containerd.service\n    Tag: container-runtime\n    name: systemd\n  outputs:\n  - Alias: node-logging-k8s-container\n    Match_Regex: kube_.*\n    Resource: k8s_container\n    Retry_Limit: 3\n    cloud_logging_base_url: https://logging.googleapis.com:443\n    export_to_project_id: timbai-gke-dev\n    http_request_key: httpRequest\n    k8s_cluster_location: us-central1-a\n    k8s_cluster_name: fluent-bit-agent-x86\n    name: stackdriver\n    severity_key: severity\n    text_payload_key: textPayload\n    tls: true\n    trace_sampled_key: logging.googleapis.com/trace_sampled\n    workers: 2\n  - Alias: node-logging-k8s-pod\n    Match_Regex: kube-pod_.*\n    Resource: k8s_pod\n    Retry_Limit: 3\n    cloud_logging_base_url: https://logging.googleapis.com:443\n    export_to_project_id: timbai-gke-dev\n    http_request_key: httpRequest\n    k8s_cluster_location: us-central1-a\n    k8s_cluster_name: fluent-bit-agent-x86\n    name: stackdriver\n    severity_key: severity\n    text_payload_key: textPayload\n    tls: true\n    trace_sampled_key: logging.googleapis.com/trace_sampled\n    workers: 2\n  - Alias: node-logging-k8s-node\n    Match_Regex: ^(?!kube(_|-pod_)).*$\n    Resource: k8s_node\n    Retry_Limit: 3\n    cloud_logging_base_url: https://logging.googleapis.com:443\n    export_to_project_id: timbai-gke-dev\n    http_request_key: httpRequest\n    k8s_cluster_location: us-central1-a\n    k8s_cluster_name: fluent-bit-agent-x86\n    name: stackdriver\n    severity_key: severity\n    text_payload_key: textPayload\n    tls: true\n    trace_sampled_key: logging.googleapis.com/trace_sampled\n    workers: 2\nservice:\n  Daemon: false\n  Flush: 5\n  Grace: 120\n  HTTP_Listen: 0.0.0.0\n  HTTP_PORT: 2020\n  HTTP_Server: true\n  Log_Level: info\n  Parsers_File: parsers.conf\n  dns.resolver: legacy\n","parsers.conf":"[PARSER]\n    Name              containerd\n    Format            regex\n    # The timestamp is described in https://www.rfc-editor.org/rfc/rfc3339#section-5.6\n    # Containerd logs follow the pattern of CRI Log Format (https://github.com/kubernetes/design-proposals-archive/blob/main/node/kubelet-cri-logging.md): \u003ctimestamp\u003e \u003cstream\u003e \u003ctag\u003e \u003clog_content\u003e\n    # F in tag means \"Full Log\", and P means \"Partial Log\".\n    \n    Regex             ^(?\u003ctime\u003e[0-9]{4}-[0-9]{2}-[0-9]{2}[Tt ][0-9]{2}:[0-9]{2}:[0-9]{2}(?:\\.[0-9]+)?(?:[Zz]|[+-][0-9]{2}:[0-9]{2}))\\s+(?\u003cstream\u003estdout|stderr)\\s(F|P)\\s(?\u003cmessage\u003e.*)$\n    \n    Time_Key          time\n    Reserve_Data      On\n    Time_Format       %Y-%m-%dT%H:%M:%S.%L%z\n    Skip_Empty_Values false\n\n[PARSER]\n    Name        json\n    Format      json\n\n[PARSER]\n    Name        syslog\n    Format      regex\n    Regex       ^\\\u003c(?\u003cpri\u003e[0-9]+)\\\u003e(?\u003ctime\u003e[^ ]* {1,2}[^ ]* [^ ]*) (?\u003chost\u003e[^ ]*) (?\u003cident\u003e[a-zA-Z0-9_\\/\\.\\-]*)(?:\\[(?\u003cpid\u003e[0-9]+)\\])?(?:[^\\:]*\\:)? *(?\u003cmessage\u003e.*)$\n    Time_Key    time\n    Time_Format %b %d %H:%M:%S\n\n[PARSER]\n    Name        glog\n    Format      regex\n    # We skip the glog timestamp as it doesn't have year (in most cases) and time zone information.\n    # Instead, we rely on the containerd timestamp, which is available for every log line.\n    Regex       ^(?\u003cseverity\u003e\\w)\\d{4}?\\d{4} [^\\s]*\\s+(?\u003cpid\u003e\\d+)\\s+(?\u003csource_file\u003e[^ \\]]+)\\:(?\u003csource_line\u003e\\d+)\\]\\s(?\u003cmessage\u003e.*)$\n\n[PARSER]\n    Name        tsl_tf_cpp\n    Format      regex\n    # TensorFlow/TSL customizes the Abseil C++ log format to include the full YYYY-MM-DD date and omits the thread ID.\n    Regex       ^\\d{4}-\\d{2}-\\d{2} \\d{2}:\\d{2}:\\d{2}\\.\\d{6}:\\s+(?\u003cseverity\u003e[IWEF])\\s+(?\u003csource_file\u003e[^\\s:]+):(?\u003csource_line\u003e\\d+)\\]\\s+(?\u003cmessage\u003e.*)$\n\n[PARSER]\n    Name        network-log\n    Format      json\n    Time_Key    timestamp\n    Time_Format %Y-%m-%dT%H:%M:%S.%L%z\n\n# Example:\n# [2023/01/05 00:01:58] [ info] [output:http:http.0] 127.0.0.1:2021, HTTP status=200\\\n# Rubular: https://screenshot.googleplex.com/8SvHiZJLUkW9idQ\n[PARSER]\n    Name   fluentbit\n    Format regex\n    \n    Regex  \\[(?\u003ctime\u003e[^\\]]+)\\][ ]*\\[[ ]*(?\u003cseverity\u003e[^\\]]+)\\][ ]*\\[(?\u003cplugin\u003e[^\\]]+)\\] (?\u003cmessage\u003e.*)\n    \n    Time_Key time\n    Time_Format %Y/%m/%d %H:%M:%S\n\n\n[PARSER]\n    Name    k8s-filter-tag-parser\n    Format  regex\n    Regex   ^(?\u003cnamespace_name\u003e[^_.]+)_(?\u003cpod_name\u003e[a-z0-9](?:[-a-z0-9]*[a-z0-9])?(?:\\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*)_(?\u003ccontainer_name\u003e[^.]+)$\n[PARSER]\n    Name    k8s-filter-tag-parser-gvisor\n    Format  regex\n    Regex   ^(?\u003cnamespace_name\u003e[^_.]+)_(?\u003cpod_name\u003e[a-z0-9](?:[-a-z0-9]*[a-z0-9])?(?:\\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*)_(?\u003ccontainer_name\u003e[^.]+)$\n\n\n\n[MULTILINE_PARSER]\n    # Fluentd rules reference: https://github.com/GoogleCloudPlatform/fluent-plugin-detect-exceptions/blob/master/lib/fluent/plugin/exception_detector.rb#L87\n    Name          php\n    Type          regex\n    Key_Content   message\n    Flush_Timeout 1000\n    Rule          \"start_state\" \"/(?:PHP\\ (?:Notice|Parse\\ error|Fatal\\ error|Warning):)|(?:exception\\ '[^']+'\\ with\\ message\\ ')/x\" \"php_stack_begin\"\n    Rule          \"php_stack_begin\"  \"/^Stack trace:/\"  \"php_stack_frames\"\n    Rule          \"php_stack_frames\" \"/^#\\d/\"           \"php_stack_frames\"\n    Rule          \"php_stack_frames\" \"/^\\s+thrown in /\" \"start_state\"\n[MULTILINE_PARSER]\n    # Fluentbit has built in ruby parser: https://github.com/fluent/fluent-bit/blob/master/src/multiline/flb_ml_parser_ruby.c, but it's not compatible with fluentd rules.\n    # Fluentd rules reference: https://github.com/GoogleCloudPlatform/fluent-plugin-detect-exceptions/blob/master/lib/fluent/plugin/exception_detector.rb#L109\n    Name          custom_ruby\n    Type          regex\n    Key_Content   message\n    Flush_Timeout 1000\n    Rule          \"start_state\"             \"/Error \\(.*\\):$/\"          \"ruby_before_rails_trace\"\n    Rule          \"ruby_before_rails_trace\" \"/^  $/\"                    \"ruby\"\n    Rule          \"ruby_before_rails_trace\" \"/^[\\t ]+.*?\\.rb:\\d+:in `/\" \"ruby\"\n    Rule          \"ruby\"                    \"/^[\\t ]+.*?\\.rb:\\d+:in `/\" \"ruby\"\n[MULTILINE_PARSER]\n    # Fluentd rules reference: https://github.com/GoogleCloudPlatform/fluent-plugin-detect-exceptions/blob/master/lib/fluent/plugin/exception_detector.rb#L116\n    Name          dart\n    Type          regex\n    Key_Content   message\n    Flush_Timeout 1000\n    Rule          \"start_state\"           \"/^Unhandled exception:$/\"                \"dart_exc\"\n    Rule          \"dart_exc\"              \"/^Instance of/\"                          \"dart_stack\"\n    Rule          \"dart_exc\"              \"/^Exception/\"                            \"dart_stack\"\n    Rule          \"dart_exc\"              \"/^Bad state/\"                            \"dart_stack\"\n    Rule          \"dart_exc\"              \"/^IntegerDivisionByZeroException/\"       \"dart_stack\"\n    Rule          \"dart_exc\"              \"/^Invalid argument/\"                     \"dart_stack\"\n    Rule          \"dart_exc\"              \"/^RangeError/\"                           \"dart_stack\"\n    Rule          \"dart_exc\"              \"/^Assertion failed/\"                     \"dart_stack\"\n    Rule          \"dart_exc\"              \"/^Cannot instantiate/\"                   \"dart_stack\"\n    Rule          \"dart_exc\"              \"/^Reading static variable/\"              \"dart_stack\"\n    Rule          \"dart_exc\"              \"/^UnimplementedError/\"                   \"dart_stack\"\n    Rule          \"dart_exc\"              \"/^Unsupported operation/\"                \"dart_stack\"\n    Rule          \"dart_exc\"              \"/^Concurrent modification/\"              \"dart_stack\"\n    Rule          \"dart_exc\"              \"/^Out of Memory/\"                        \"dart_stack\"\n    Rule          \"dart_exc\"              \"/^Stack Overflow/\"                       \"dart_stack\"\n    Rule          \"dart_exc\"              \"/^'.+?':.+?$/\"                           \"dart_type_err_line1\"\n    Rule          \"dart_type_err_line1\"   \"/^#\\d+\\s+.+?\\(.+?\\)$/\"         \"dart_stack\"\n    Rule          \"dart_type_err_line1\"   \"/^.+?$/\"                       \"dart_type_err_line2\"\n    Rule          \"dart_type_err_line2\"   \"/^.*?\\^.*?$/\"                  \"dart_type_err_line3\"\n    Rule          \"dart_type_err_line3\"   \"/^$/\"                          \"dart_type_err_line4\"\n    Rule          \"dart_type_err_line4\"   \"/^$/\"                          \"dart_stack\"\n    Rule          \"dart_exc\"              \"/^FormatException/\"            \"dart_format_err_line1\"\n    Rule          \"dart_format_err_line1\" \"/^#\\d+\\s+.+?\\(.+?\\)$/\"         \"dart_stack\"\n    Rule          \"dart_format_err_line1\" \"/^./\"                          \"dart_format_err_line2\"\n    Rule          \"dart_format_err_line2\" \"/^.*?\\^/\"                      \"dart_format_err_line3\"\n    Rule          \"dart_format_err_line3\" \"/^$/\"                          \"dart_stack\"\n    Rule          \"dart_exc\"              \"/^NoSuchMethodError:/\"         \"dart_method_err_line1\"\n    Rule          \"dart_method_err_line1\" \"/^Receiver:/\"                  \"dart_method_err_line2\"\n    Rule          \"dart_method_err_line2\" \"/^Tried calling:/\"             \"dart_method_err_line3\"\n    Rule          \"dart_method_err_line3\" \"/^Found:/\"                     \"dart_stack\"\n    Rule          \"dart_method_err_line3\" \"/^#\\d+\\s+.+?\\(.+?\\)$/\"         \"dart_stack\"\n    Rule          \"dart_stack\"            \"/^#\\d+\\s+.+?\\(.+?\\)$/\"         \"dart_stack\"\n    Rule          \"dart_stack\"            \"/^\u003casynchronous suspension\u003e$/\" \"dart_stack\"","redact_kubelet.lua":"function redact_sensitive_info(tag, timestamp, record)\n  message = record[\"MESSAGE\"]\n  if message then\n    if string.find(message, \"access_token=ya29.[a-zA-Z0-9._-]*\") then\n      local redact_message = string.gsub(message, \"access_token=ya29.[a-zA-Z0-9._-]*\", \"access_token=\u003cREDACTED\u003e\")\n      record[\"MESSAGE\"] = redact_message\n      return 2, timestamp, record\n    end\n  end\n  return 0, timestamp, record\nend"},"kind":"ConfigMap","metadata":{"annotations":{"components.gke.io/component-name":"fluentbit","components.gke.io/component-version":"1.36.3-gke.0"},"creationTimestamp":"2026-06-26T18:19:17Z","labels":{"addonmanager.kubernetes.io/mode":"Reconcile"},"name":"fluentbit-gke-config","namespace":"kube-system","resourceVersion":"1782516367999711023","uid":"7414a7d9-be31-4cdd-8730-c5f140072a19"}}
