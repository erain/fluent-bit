apiVersion: v1
data:
  fluent-bit.yaml: |
    pipeline:
      filters:
      - buffer: true
        emitter_mem_buf_limit: 100MB
        emitter_name: system_container_logs_multiline
        flush_ms: 500
        match_regex: kube-pod_.*|kube_kube-system_*|kube_istio-system_*|kube_knative-serving_*|kube_gke-system_*|kube_config-management-system_*|kube_gmp-system_*|kube_gke-managed-cim_*|kube_gke-managed-volumepopulator_*|kube_gke-managed-checkpointing_*|kube_gke-managed-lustrecsi_*|kube_gke-managed-otel_*|kube_gke-managed-mldiagnostics_*|kube_gke-managed-networking-dra-driver_*|kube_gke-managed-pod-snapshots_*|kube_gke-managed-slurm_*
        multiline.key_content: message
        multiline.parser: go
        name: multiline
      - Call: cb_filter
        Match: kube_kube-system_fluentbit-gke_fluentbit
        Script: /fluent-bit/lua-filters/rate_limiter.lua
        name: lua
      - Call: rate_limit
        Match: kube_kube-system_fluentbit-gke_fluentbit
        Script: /fluent-bit/lua-filters/rate_limiter.lua
        name: lua
      - Alias: redact-kubelet-lua
        Call: redact_sensitive_info
        Match: kubelet
        Script: redact_kubelet.lua
        name: lua
      - Alias: kubelet_remove_cmdline
        Match: kubelet
        Remove: _CMDLINE
        name: modify
      - Call: processContainerdLogLevel
        Match: container-runtime
        Script: /fluent-bit/lua-filters/parser.lua
        name: lua
      - Hard_rename: log message
        Match: '*'
        name: modify
      - Key_Name: message
        Match: kube_*
        Parser: json
        Reserve_Data: true
        name: parser
      - Copy: level severity
        Match: kube_*
        name: modify
      - Annotations: false
        Buffer_Size: 2MB
        DNS_Retries: 3
        DNS_Wait_Time: 10
        Kube_CA_File: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
        Kube_Meta_Cache_TTL: 30
        Kube_Tag_Prefix: kube_
        Kube_Token_File: /var/run/secrets/kubernetes.io/serviceaccount/token
        Kube_URL: https://${KUBERNETES_SERVICE_HOST}:${KUBERNETES_SERVICE_PORT}
        Kubelet_Host: ${HOST_IP}
        Kubelet_Port: 10250
        Labels: true
        Match: kube_*
        Owner_References: true
        Regex_Parser: k8s-filter-tag-parser
        Use_Kubelet: 'On'
        name: kubernetes
      - Annotations: false
        Buffer_Size: 2MB
        DNS_Retries: 3
        DNS_Wait_Time: 10
        Kube_CA_File: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
        Kube_Meta_Cache_TTL: 30
        Kube_Tag_Prefix: kube-pod_
        Kube_Token_File: /var/run/secrets/kubernetes.io/serviceaccount/token
        Kube_URL: https://${KUBERNETES_SERVICE_HOST}:${KUBERNETES_SERVICE_PORT}
        Kubelet_Host: ${HOST_IP}
        Kubelet_Port: 10250
        Labels: true
        Match: kube-pod_*
        Owner_References: false
        Regex_Parser: k8s-filter-tag-parser-gvisor
        Use_Kubelet: 'On'
        name: kubernetes
      - Alias: parser
        Call: processRecord
        Match: '*'
        Script: /fluent-bit/lua-filters/parser.lua
        name: lua
      inputs:
      - Alias: kube_kube-system_fluentbit-gke_fluentbit
        Buffer_Max_Size: 5MB
        DB: /var/lib/google-fluentbit/pos-files/fluentbit.db
        Mem_Buf_Limit: 10MB
        Parser: fluentbit
        Path: /var/log/containers/*_kube-system_fluentbit-[0-9a-f]*.log
        Read_from_Head: true
        Tag: kube_kube-system_fluentbit-gke_fluentbit
        name: tail
      - Alias: kube_containers_kube-system
        Buffer_Chunk_Size: 1MB
        Buffer_Max_Size: 1MB
        DB: /var/lib/google-fluentbit/pos-files/flb_kube_kube-system.db
        Exclude_Path: /var/log/containers/*_kube-system_fluentbit-[0-9a-f]*.log
        Mem_Buf_Limit: 5MB
        Parser: containerd
        Path: /var/log/containers/*_kube-system_*.log
        Read_from_Head: true
        Refresh_Interval: 5
        Rotate_Wait: 15
        Skip_Long_Lines: true
        Tag: kube_<namespace_name>_<pod_name>_<container_name>
        Tag_Regex: (?<pod_name>[a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*)_(?<namespace_name>[^_]+)_(?<container_name>.+)-
