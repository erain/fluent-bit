steps:
- name: 'gcr.io/cloud-builders/docker'
  args: ['buildx', 'create', '--name', 'mybuilder', '--use']
- name: 'gcr.io/cloud-builders/docker'
  args: [
    'buildx', 'build',
    '--platform', 'linux/arm64',
    '-t', 'us-central1-docker.pkg.dev/timbai-gke-dev/gke-component-images/fluentbit:opt-day3-test-6-arm64',
    '--target', 'production',
    '--build-arg', 'EXTRA_CMAKE_FLAGS=-DFLB_IN_CPU=Off -DFLB_IN_THERMAL=Off -DFLB_IN_DISK=Off -DFLB_IN_DOCKER=Off -DFLB_IN_DOCKER_EVENTS=Off -DFLB_IN_EXEC=Off -DFLB_IN_EXEC_WASI=Off -DFLB_IN_FORWARD=Off -DFLB_IN_HEALTH=Off -DFLB_IN_HTTP=Off -DFLB_IN_MEM=Off -DFLB_IN_SYSTEMD=On -DFLB_IN_COLLECTD=Off -DFLB_IN_STATSD=Off -DFLB_IN_HEAD=Off -DFLB_IN_DUMMY=Off -DFLB_IN_MQTT=Off -DFLB_IN_TCP=Off -DFLB_IN_UDP=Off -DFLB_IN_SYSLOG=Off -DFLB_IN_STDIN=Off -DFLB_IN_SERIAL=Off -DFLB_IN_STREAM_PROCESSOR=Off -DFLB_IN_NGINX_EXPORTER_METRICS=Off -DFLB_IN_STORAGE_BACKLOG=Off -DFLB_IN_EVENT_TYPE=Off -DFLB_IN_PROMETHEUS_REMOTE_WRITE=Off -DFLB_IN_SPLUNK=Off -DFLB_IN_CALYPTIA_FLEET=Off -DFLB_IN_ELASTICSEARCH=Off -DFLB_IN_OPENTELEMETRY=Off -DFLB_IN_KAFKA=Off -DFLB_IN_FLUENTBIT_METRICS=Off -DFLB_IN_EMITTER=On -DFLB_IN_PROMETHEUS_SCRAPE=Off -DFLB_OUT_AZURE=Off -DFLB_OUT_AZURE_BLOB=Off -DFLB_OUT_BIGQUERY=Off -DFLB_OUT_CALYPTIA=Off -DFLB_OUT_COUNTER=Off -DFLB_OUT_DATADOG=Off -DFLB_OUT_ES=Off -DFLB_OUT_EXIT=Off -DFLB_OUT_FORWARD=Off -DFLB_OUT_GELF=Off -DFLB_OUT_HTTP=Off -DFLB_OUT_KAFKA=Off -DFLB_OUT_PGSQL=Off -DFLB_OUT_SPLUNK=Off -DFLB_OUT_SLACK=Off -DFLB_OUT_SKYWALKING=Off -DFLB_OUT_ORACLE_LOG_ANALYTICS=Off -DFLB_OUT_OPENSEARCH=Off -DFLB_OUT_NATS=Off -DFLB_OUT_S3=Off -DFLB_OUT_LOKI=Off -DFLB_OUT_LOGDNA=Off -DFLB_OUT_INFLUXDB=Off -DFLB_OUT_FILE=Off -DFLB_OUT_AZURE_KUSTO=Off -DFLB_OUT_AZURE_LOGS_INGESTION=Off -DFLB_OUT_NRLOGS=Off -DFLB_OUT_STDOUT=Off -DFLB_OUT_NULL=Off -DFLB_OUT_PLOT=Off -DFLB_OUT_VIVO_EXPORTER=Off -DFLB_OUT_CHRONICLE=Off -DFLB_OUT_PROMETHEUS_REMOTE_WRITE=Off -DFLB_OUT_PROMETHEUS_EXPORTER=Off -DFLB_OUT_OPENTELEMETRY=Off -DFLB_OUT_KINESIS_STREAMS=Off -DFLB_OUT_KINESIS_FIREHOSE=Off -DFLB_OUT_KAFKA_REST=Off -DFLB_OUT_SYSLOG=Off -DFLB_KAFKA=Off -DFLB_WASM=Off -DFLB_RIPSER=Off -DFLB_PROXY_GO=Off -DFLB_CUSTOM_CALYPTIA=Off',
    '--push',
    '-f', 'Dockerfile',
    '.'
  ]
timeout: 7200s
options:
  logging: CLOUD_LOGGING_ONLY
  machineType: 'E2_HIGHCPU_32'



