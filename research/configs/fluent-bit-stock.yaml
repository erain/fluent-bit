      Path:              /var/log/containers/*.log
      Exclude_Path:      /var/log/containers/*_kube-system_*.log,/var/log/containers/*_istio-system_*.log,/var/log/containers/*_knative-serving_*.log,/var/log/containers/*_gke-system_*.log,/var/log/containers/*_config-management-system_*.log,/var/log/containers/*_gmp-system_*.log,/var/log/containers/*_gke-managed-cim_*.log,/var/log/containers/*_gke-managed-volumepopulator_*.log,/var/log/containers/*_gke-managed-checkpointing_*.log,/var/log/containers/*_gke-managed-lustrecsi_*.log,/var/log/containers/*_gke-managed-otel_*.log,/var/log/containers/*_gke-managed-mldiagnostics_*.log,/var/log/containers/*_gke-managed-networking-dra-driver_*.log,/var/log/containers/*_gke-managed-pod-snapshots_*.log,/var/log/containers/*_gke-managed-slurm_*.log
      DB:                /var/lib/google-fluentbit/pos-files/flb_kube.db
      Parser:            containerd
      Rotate_Wait:       15
      Threaded:          On
      Buffer_Chunk_Size: 1MB
      Buffer_Max_Size:   20MB
      Mem_Buf_Limit:     100MB
      Skip_Long_Lines:   On
      Refresh_Interval:  1
      Read_from_Head:    True
      
      # Move multiline parser for customer workload logs to the processor of the input plugin.
      # This improves log throughput to 20MB+/s by reducing CPU contention of main thread.
      processors:
        logs:
          - name:                    multiline
            buffer:                  True
            emitter_mem_buf_limit:   200MB
            flush_ms:                500
            multiline.key_content:   message
            emitter_name:            customer_logs_multiline_processor
            multiline.parser:        go,java,python,php,custom_ruby,dart
      
    

  # This input is used to watch changes to Kubernetes pod log files live in the
  # directory /var/log/pods/NAMESPACE_NAME_UID. The file name is used to
