service:
  Flush:         5
  Grace:         120
  Log_Level:     info
  
  Daemon:        off
  Parsers_File:  parsers.conf
  HTTP_Server:   On
  
  HTTP_Listen:   0.0.0.0
  
  HTTP_PORT:     2020
  dns.resolver:  legacy

pipeline:
  inputs:
    - name:            tail
      
      Alias:           kube_kube-system_fluentbit-gke_fluentbit
      Tag:             kube_kube-system_fluentbit-gke_fluentbit
      # We use [0-9a-f] to match the hex container ID of the main fluentbit container.
      # This prevents matching fluentbit-metrics-collector whose name follows the hyphen.
      Path:            /var/log/containers/*_kube-system_fluentbit-[0-9a-f]*.log
      
      DB:              /var/lib/google-fluentbit/pos-files/fluentbit.db
      Buffer_Max_Size: 5MB
      Mem_Buf_Limit:   10MB
      Parser:          fluentbit
      Read_from_Head:  True
    
    - name:              tail
      Alias:             kube_containers_kube-system
      Tag:               kube_<namespace_name>_<pod_name>_<container_name>
      Tag_Regex:         (?<pod_name>[a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*)_(?<namespace_name>[^_]+)_(?<container_name>.+)-
      Path:              /var/log/containers/*_kube-system_*.log
      DB:                /var/lib/google-fluentbit/pos-files/flb_kube_kube-system.db
      Parser:            containerd
      
      # Exclude only the main fluentbit container logs here, so that
      # fluentbit-metrics-collector logs are captured by this generic input
      # and get the correct container name label.
      Exclude_Path:      /var/log/containers/*_kube-system_fluentbit-[0-9a-f]*.log
      
      Rotate_Wait:       15
      Buffer_Chunk_Size: 1MB
      Buffer_Max_Size:   1MB
      Mem_Buf_Limit:     5MB
      Skip_Long_Lines:   On
      Refresh_Interval:  5
      Read_from_Head:    True
    
    - name:              tail
      Alias:             kube_containers_istio-system
