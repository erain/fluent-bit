  filters:
    
    # Create a separate regular multiline parser for GKE system container logs,
    # having one multiline parser per input plugin degrades log throughput as
    # there will be ~20 processors contending for CPU.
    - name:                    multiline
      match_regex:             kube-pod_.*|kube_kube-system_*|kube_istio-system_*|kube_knative-serving_*|kube_gke-system_*|kube_config-management-system_*|kube_gmp-system_*|kube_gke-managed-cim_*|kube_gke-managed-volumepopulator_*|kube_gke-managed-checkpointing_*|kube_gke-managed-lustrecsi_*|kube_gke-managed-otel_*|kube_gke-managed-mldiagnostics_*|kube_gke-managed-networking-dra-driver_*|kube_gke-managed-pod-snapshots_*|kube_gke-managed-slurm_*
      buffer:                  True
      emitter_mem_buf_limit:   100MB
      flush_ms:                500
      multiline.key_content:   message
      emitter_name:            system_container_logs_multiline
      multiline.parser:        go
    - name:    lua
      Match:   kube_kube-system_fluentbit-gke_fluentbit
      Script:  /fluent-bit/lua-filters/rate_limiter.lua
      Call:    cb_filter
    - name:    lua
      Match:   kube_kube-system_fluentbit-gke_fluentbit
      Script:  /fluent-bit/lua-filters/rate_limiter.lua
      Call:    rate_limit
    

    - name:         lua
      Alias:        redact-kubelet-lua
      Match:        kubelet
      Script:       redact_kubelet.lua
      Call:         redact_sensitive_info

    - name:         modify
      Match:        kubelet
      Alias:        kubelet_remove_cmdline
      Remove:       _CMDLINE

  
    - name:         lua
      Match:        container-runtime
      Script:       /fluent-bit/lua-filters/parser.lua
      Call:         processContainerdLogLevel
  

    - name:         modify
      Match:        '*'
      Hard_rename:  log message

    - name:         parser
      Match:        kube_*
      Key_Name:     message
      Reserve_Data: On
      Parser:       glog
      Parser:       tsl_tf_cpp
      Parser:       json

    

    # level is a common synonym for severity,
    # the default field name in libraries such as GoLang's zap.
    # populate severity with level, if severity does not exist.
    - name:        modify
      Match:       kube_*
      Copy:        level severity

    

    
    - name:                kubernetes
      Match:               kube_*
      Kube_URL:            https://${KUBERNETES_SERVICE_HOST}:${KUBERNETES_SERVICE_PORT}
      Kube_CA_File:        /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
      Kube_Token_File:     /var/run/secrets/kubernetes.io/serviceaccount/token
      Kube_Tag_Prefix:     kube_
      Kube_Meta_Cache_TTL: 30
      DNS_Retries:         3
      DNS_Wait_Time:       10
      Buffer_Size:         2MB
      Use_Kubelet:         On
      Kubelet_Host:        ${HOST_IP}
      Kubelet_Port:        10250
      Labels:              On
      Annotations:         Off
      Owner_References:    On
      Regex_Parser:        k8s-filter-tag-parser
    - name:                kubernetes
      Match:               kube-pod_*
      Kube_URL:            https://${KUBERNETES_SERVICE_HOST}:${KUBERNETES_SERVICE_PORT}
      Kube_CA_File:        /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
      Kube_Token_File:     /var/run/secrets/kubernetes.io/serviceaccount/token
      Kube_Tag_Prefix:     kube-pod_
      Kube_Meta_Cache_TTL: 30
      DNS_Retries:         3
      DNS_Wait_Time:       10
      Buffer_Size:         2MB
      Use_Kubelet:         On
      Kubelet_Host:        ${HOST_IP}
      Kubelet_Port:        10250
      Labels:              On
      Annotations:         Off
      Owner_References:    Off
      Regex_Parser:        k8s-filter-tag-parser-gvisor
    - name:    lua
      Alias:   parser
      Match:   '*'
      Script:  /fluent-bit/lua-filters/parser.lua
      Call:    processRecord
    

  outputs:
    

    

    
    - name:                          stackdriver
      Alias:                         node-logging-k8s-container
      Match_Regex:                   kube_.*
      Resource:                      k8s_container
      # k8s_container resource type requires the following fields to be set, even though they are not used.
      # MonitoredResource.labels are set in parser.lua filter and parsed in out_stackdriver plugin.
      # See https://github.com/fluent/fluent-bit/blob/v3.1.4/plugins/out_stackdriver/stackdriver_conf.c#L466
      k8s_cluster_name:              fluent-bit-agent-x86
      k8s_cluster_location:          us-central1-a
      severity_key:                  severity
      http_request_key:              httpRequest
      text_payload_key:              textPayload
      trace_sampled_key:             "logging.googleapis.com/trace_sampled"
      export_to_project_id:          timbai-gke-dev
      workers:                       1
      # fluentbit requires the protocol in the url
      cloud_logging_base_url:        https://logging.googleapis.com:443
      Retry_Limit:                   3
      tls:                           On
    - name:                          stackdriver
      Alias:                         node-logging-k8s-pod
      Match_Regex:                   kube-pod_.*
